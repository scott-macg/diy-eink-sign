<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%" style="background-color: #ffffff; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <style>
      .wire { stroke: #1e293b; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .power-wire { stroke: #dc2626; stroke-width: 2.5; fill: none; stroke-linecap: round; }
      .gnd-wire { stroke: #1e293b; stroke-width: 2.5; fill: none; stroke-linecap: round; }
      .signal-wire { stroke: #0284c7; stroke-width: 2.5; fill: none; stroke-linecap: round; }
      .symbol { stroke: #0f172a; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .node { fill: #0f172a; }
      .text-title { font-size: 20px; font-weight: 700; fill: #0f172a; }
      .text-sub { font-size: 13px; fill: #64748b; }
      .text-label { font-size: 14px; font-weight: 600; fill: #0f172a; }
      .text-val { font-size: 13px; font-style: italic; fill: #475569; }
      .text-pin { font-size: 12px; font-weight: 700; fill: #0284c7; }
      .text-power { font-size: 14px; font-weight: 700; fill: #dc2626; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 6px; }
      .highlight-box { fill: #f0f9ff; stroke: #bae6fd; stroke-width: 1.5; rx: 8px; }
      .bat-box { fill: #fef2f2; stroke: #fca5a5; stroke-width: 1.5; rx: 8px; }
    </style>
  </defs>

  <!-- Background Card -->
  <rect x="20" y="20" width="760" height="480" class="box" />
  <text x="40" y="55" class="text-title">Battery Charging &amp; Voltage Sensing Schematic</text>
  <text x="40" y="75" class="text-sub">DIY 2.9" E-Ink Sign • 3.7V LiPo Battery + 2x 100kΩ ADC Voltage Divider</text>

  <!-- LiPo Battery Block -->
  <rect x="40" y="140" width="180" height="120" class="bat-box" />
  <text x="130" y="170" text-anchor="middle" class="text-power">3.7V LiPo Battery</text>
  <text x="130" y="190" text-anchor="middle" class="text-val">800mAh (902540)</text>
  <text x="130" y="210" text-anchor="middle" class="text-sub">Integrated PCM Protection</text>
  <text x="130" y="235" text-anchor="middle" font-size="11" fill="#991b1b">Max 4.2V • Nom 3.7V</text>

  <!-- Battery Terminals -->
  <circle cx="220" cy="170" r="4" fill="#dc2626" />
  <text x="205" y="165" class="text-power">BAT+</text>
  <circle cx="220" cy="230" r="4" fill="#0f172a" />
  <text x="205" y="245" class="text-label">BAT-</text>

  <!-- Wire BAT- to GND -->
  <line x1="220" y1="230" x2="300" y2="230" class="gnd-wire" />
  <line x1="300" y1="230" x2="300" y2="380" class="gnd-wire" />
  <circle cx="300" cy="380" r="4" class="node" />

  <!-- Wire BAT+ to Division Node -->
  <line x1="220" y1="170" x2="300" y2="170" class="power-wire" />
  <circle cx="300" cy="170" r="4" fill="#dc2626" />

  <!-- Wire BAT+ to XIAO Charger Pad -->
  <line x1="300" y1="170" x2="520" y2="170" class="power-wire" />
  <text x="410" y="160" text-anchor="middle" class="text-power">BAT+ Rail (V_BAT)</text>

  <!-- Resistor R1 (100kΩ Upper Divider) Vertical -->
  <line x1="300" y1="170" x2="300" y2="200" class="wire" />
  <g>
    <polyline points="300,200 300,205 312,210 288,220 312,230 288,240 312,250 288,260 300,265 300,270" class="symbol" />
    <text x="325" y="230" class="text-label">R1</text>
    <text x="325" y="248" class="text-val">100 kΩ (1%)</text>
  </g>
  <line x1="300" y1="270" x2="300" y2="290" class="wire" />

  <!-- Midpoint Sensing Node (ADC Node) -->
  <circle cx="300" cy="290" r="4" class="node" />

  <!-- Resistor R2 (100kΩ Lower Divider) Vertical -->
  <line x1="300" y1="290" x2="300" y2="310" class="wire" />
  <g>
    <polyline points="300,310 300,315 312,320 288,330 312,340 288,350 312,360 288,370 300,375 300,380" class="symbol" />
    <text x="325" y="340" class="text-label">R2</text>
    <text x="325" y="358" class="text-val">100 kΩ (1%)</text>
  </g>
  <line x1="300" y1="380" x2="300" y2="410" class="gnd-wire" />

  <!-- Ground Connection for Divider -->
  <g>
    <line x1="300" y1="410" x2="300" y2="425" class="gnd-wire" />
    <line x1="280" y1="425" x2="320" y2="425" stroke="#0f172a" stroke-width="3" stroke-linecap="round" />
    <line x1="288" y1="432" x2="312" y2="432" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" />
    <line x1="294" y1="439" x2="306" y2="439" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />
    <line x1="298" y1="445" x2="302" y2="445" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" />
    <text x="300" y="465" text-anchor="middle" class="text-label">GND</text>
  </g>

  <!-- Signal Wire from Midpoint Node to MCU D0 -->
  <line x1="300" y1="290" x2="520" y2="290" class="signal-wire" />
  <text x="410" y="280" text-anchor="middle" class="text-pin">V_ADC = V_BAT / 2.0</text>
  <text x="410" y="310" text-anchor="middle" class="text-sub">(2.1V Max @ 4.2V Bat)</text>

  <!-- MCU Block -->
  <rect x="520" y="140" width="220" height="200" class="highlight-box" />
  <text x="630" y="170" text-anchor="middle" class="text-label">XIAO ESP32-C6</text>
  <text x="630" y="190" text-anchor="middle" class="text-sub">Onboard LiPo Charger &amp; ADC</text>

  <rect x="535" y="210" width="190" height="35" fill="#ffffff" stroke="#cbd5e1" rx="4" />
  <text x="545" y="232" class="text-power">BAT+ / BAT- Pads</text>
  <text x="715" y="232" text-anchor="end" class="text-sub">ETA6003 Charger</text>

  <rect x="535" y="270" width="190" height="40" fill="#ffffff" stroke="#bae6fd" rx="4" />
  <text x="545" y="295" class="text-pin">Pin D0 / GPIO 0</text>
  <text x="715" y="295" text-anchor="end" class="text-val">ADC1_CH0 (12-bit)</text>

  <!-- Explanatory Callout Box -->
  <rect x="40" y="320" width="230" height="150" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" rx="6" />
  <text x="50" y="342" font-size="12" font-weight="700" fill="#1e293b">Divider Math &amp; Voltage Scaling:</text>
  <text x="50" y="362" font-size="11" fill="#475569">• <tspan font-weight="600">Ratio:</tspan> R2 / (R1 + R2) = 0.50</text>
  <text x="50" y="380" font-size="11" fill="#475569">• <tspan font-weight="600">Full Charge (4.20V):</tspan> 2.10V ADC</text>
  <text x="50" y="398" font-size="11" fill="#475569">• <tspan font-weight="600">Nominal (3.70V):</tspan> 1.85V ADC</text>
  <text x="50" y="416" font-size="11" fill="#475569">• <tspan font-weight="600">Cutoff (3.30V):</tspan> 1.65V ADC</text>
  <text x="50" y="434" font-size="11" fill="#0284c7">• Protects GPIO 0 (3.3V Max limit)</text>
  <text x="50" y="452" font-size="11" fill="#475569">• High 100kΩ values minimize drain</text>
</svg>
