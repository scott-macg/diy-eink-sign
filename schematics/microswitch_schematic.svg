<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%" style="background-color: #ffffff; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <style>
      .wire { stroke: #1e293b; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .gnd-wire { stroke: #1e293b; stroke-width: 2.5; fill: none; stroke-linecap: round; }
      .sw1-wire { stroke: #2563eb; stroke-width: 2.5; fill: none; stroke-linecap: round; }
      .sw2-wire { stroke: #059669; stroke-width: 2.5; fill: none; stroke-linecap: round; }
      .sw3-wire { stroke: #94a3b8; stroke-width: 2; fill: none; stroke-linecap: round; stroke-dasharray: 4,4; }
      .symbol { stroke: #0f172a; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .node { fill: #0f172a; }
      .text-title { font-size: 20px; font-weight: 700; fill: #0f172a; }
      .text-sub { font-size: 13px; fill: #64748b; }
      .text-label { font-size: 14px; font-weight: 600; fill: #0f172a; }
      .text-val { font-size: 13px; font-style: italic; fill: #475569; }
      .text-pin { font-size: 12px; font-weight: 700; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 6px; }
      .highlight-box { fill: #f0f9ff; stroke: #bae6fd; stroke-width: 1.5; rx: 8px; }
      .sw-box { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; rx: 8px; }
      .disabled-box { fill: #fafafa; stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 4,4; rx: 8px; }
    </style>
  </defs>

  <!-- Background Card -->
  <rect x="20" y="20" width="760" height="480" class="box" />
  <text x="40" y="52" class="text-title">Dual Microswitch Breakouts Schematic</text>
  <text x="40" y="70" class="text-sub">DIY 2.9" E-Ink Sign • Tactile Pushbuttons on D9 &amp; D7 (Pivoted from Underside RST)</text>

  <!-- Left Block: MCU Input Pins -->
  <rect x="40" y="100" width="220" height="370" class="highlight-box" />
  <text x="150" y="125" text-anchor="middle" class="text-label" fill="#0369a1">XIAO ESP32-C6</text>

  <!-- SW1 Input Pin (D9 / GPIO 9) -->
  <rect x="55" y="150" width="190" height="45" fill="#ffffff" stroke="#93c5fd" rx="4" />
  <text x="65" y="172" class="text-pin" fill="#1d4ed8">Pin D9 / GPIO 9 (SW1)</text>
  <text x="65" y="187" class="text-sub">(Internal 45kΩ Pull-Up to 3.3V)</text>

  <!-- SW2 Input Pin (D7 / GPIO 17) -->
  <rect x="55" y="270" width="190" height="45" fill="#ffffff" stroke="#a7f3d0" rx="4" />
  <text x="65" y="292" class="text-pin" fill="#047857">Pin D7 / GPIO 17 (SW2)</text>
  <text x="65" y="307" class="text-sub">(Internal 45kΩ Pull-Up to 3.3V)</text>

  <!-- Reserved Hardware Reset Pin (CHIP_PU) -->
  <rect x="55" y="390" width="190" height="45" fill="#fafafa" stroke="#cbd5e1" stroke-dasharray="3,3" rx="4" />
  <text x="65" y="412" class="text-pin" fill="#64748b">CHIP_PU / RST (Reserved)</text>
  <text x="65" y="427" class="text-sub">(Future Hardware Revision)</text>

  <!-- Signal Wires to Switches -->
  <line x1="245" y1="172" x2="380" y2="172" class="sw1-wire" />
  <line x1="245" y1="292" x2="380" y2="292" class="sw2-wire" />
  <line x1="245" y1="412" x2="380" y2="412" class="sw3-wire" />

  <!-- SW1 Schematic Symbol & Container -->
  <g>
    <rect x="380" y="115" width="370" height="110" class="sw-box" />
    <text x="400" y="138" class="text-label">SW1: Primary Action / Forward Switch</text>
    <text x="400" y="153" class="text-sub">Connected to D9 (GPIO 9) • Supports Click, Double-Click &amp; Hold</text>

    <!-- Switch Symbol SW1 -->
    <circle cx="490" cy="172" r="4" fill="#0f172a" />
    <circle cx="560" cy="172" r="4" fill="#0f172a" />
    <line x1="490" y1="172" x2="555" y2="155" stroke="#0f172a" stroke-width="3" stroke-linecap="round" />
    <line x1="525" y1="150" x2="525" y2="132" stroke="#64748b" stroke-width="2" stroke-dasharray="3,3" />
    <rect x="510" y="124" width="30" height="8" fill="#2563eb" rx="2" />

    <text x="475" y="192" class="text-pin" fill="#1d4ed8">Term A</text>
    <text x="545" y="192" class="text-label">Term B</text>

    <!-- Wire from SW1 to GND Rail -->
    <line x1="560" y1="172" x2="680" y2="172" class="gnd-wire" />
    <line x1="680" y1="172" x2="680" y2="292" class="gnd-wire" />
    <circle cx="680" cy="292" r="4" class="node" />
  </g>

  <!-- SW2 Schematic Symbol & Container -->
  <g>
    <rect x="380" y="235" width="370" height="110" class="sw-box" />
    <text x="400" y="258" class="text-label">SW2: Secondary Action / Back Switch</text>
    <text x="400" y="273" class="text-sub">Connected to D7 (GPIO 17) • Supports Click, Double-Click &amp; Hold</text>

    <!-- Switch Symbol SW2 -->
    <circle cx="490" cy="292" r="4" fill="#0f172a" />
    <circle cx="560" cy="292" r="4" fill="#0f172a" />
    <line x1="490" y1="292" x2="555" y2="275" stroke="#0f172a" stroke-width="3" stroke-linecap="round" />
    <line x1="525" y1="270" x2="525" y2="252" stroke="#64748b" stroke-width="2" stroke-dasharray="3,3" />
    <rect x="510" y="244" width="30" height="8" fill="#059669" rx="2" />

    <text x="475" y="312" class="text-pin" fill="#047857">Term A</text>
    <text x="545" y="312" class="text-label">Term B</text>

    <!-- Wire from SW2 to GND -->
    <line x1="560" y1="292" x2="680" y2="292" class="gnd-wire" />
    <line x1="680" y1="292" x2="680" y2="445" class="gnd-wire" />
  </g>

  <!-- Reserved HW Reset (Commented Out for Future Revision) -->
  <g>
    <rect x="380" y="355" width="370" height="100" class="disabled-box" />
    <text x="400" y="378" font-size="13" font-weight="600" fill="#64748b">Reserved: Hard Reset Switch (CHIP_PU)</text>
    <text x="400" y="395" font-size="11" fill="#94a3b8">Commented out in code &amp; layout for future PCB revisions</text>
  </g>

  <!-- Common Ground Connection -->
  <g>
    <line x1="680" y1="445" x2="680" y2="460" class="gnd-wire" />
    <line x1="660" y1="460" x2="700" y2="460" stroke="#0f172a" stroke-width="3" stroke-linecap="round" />
    <line x1="668" y1="467" x2="692" y2="467" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" />
    <line x1="674" y1="474" x2="686" y2="474" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />
    <line x1="678" y1="480" x2="682" y2="480" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" />
    <text x="680" y="498" text-anchor="middle" class="text-label">GND</text>
  </g>
</svg>
