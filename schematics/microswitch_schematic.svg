<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%" style="background-color: #ffffff; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <style>
      .wire { stroke: #1e293b; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .gnd-wire { stroke: #1e293b; stroke-width: 2.5; fill: none; stroke-linecap: round; }
      .sw1-wire { stroke: #2563eb; stroke-width: 2.5; fill: none; stroke-linecap: round; }
      .sw2-wire { stroke: #d97706; stroke-width: 2.5; fill: none; stroke-linecap: round; }
      .symbol { stroke: #0f172a; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .node { fill: #0f172a; }
      .text-title { font-size: 20px; font-weight: 700; fill: #0f172a; }
      .text-sub { font-size: 13px; fill: #64748b; }
      .text-label { font-size: 14px; font-weight: 600; fill: #0f172a; }
      .text-val { font-size: 13px; font-style: italic; fill: #475569; }
      .text-pin { font-size: 12px; font-weight: 700; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 6px; }
      .highlight-box { fill: #f0f9ff; stroke: #bae6fd; stroke-width: 1.5; rx: 8px; }
      .sw-box { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; rx: 8px; }
    </style>
  </defs>

  <!-- Background Card -->
  <rect x="20" y="20" width="760" height="440" class="box" />
  <text x="40" y="55" class="text-title">Microswitch Breakouts Schematic</text>
  <text x="40" y="75" class="text-sub">DIY 2.9" E-Ink Sign • Tactile Pushbuttons for Force-Refresh/Mode &amp; Hard Reset</text>

  <!-- Left Block: MCU Input Pins -->
  <rect x="40" y="120" width="220" height="300" class="highlight-box" />
  <text x="150" y="150" text-anchor="middle" class="text-label" fill="#0369a1">XIAO ESP32-C6</text>

  <!-- SW1 Input Pin (D9 / GPIO 9) -->
  <rect x="55" y="180" width="190" height="45" fill="#ffffff" stroke="#93c5fd" rx="4" />
  <text x="65" y="202" class="text-pin" fill="#1d4ed8">Pin D9 / GPIO 9</text>
  <text x="65" y="217" class="text-sub">(Internal 45kΩ Pull-Up to 3.3V)</text>

  <!-- SW2 Input Pin (RST / CHIP_PU) -->
  <rect x="55" y="320" width="190" height="45" fill="#ffffff" stroke="#fcd34d" rx="4" />
  <text x="65" y="342" class="text-pin" fill="#b45309">Pin RST / CHIP_PU</text>
  <text x="65" y="357" class="text-sub">(Hardware Chip Enable)</text>

  <!-- Signal Wires to Switches -->
  <line x1="245" y1="202" x2="380" y2="202" class="sw1-wire" />
  <line x1="245" y1="342" x2="380" y2="342" class="sw2-wire" />

  <!-- SW1 Schematic Symbol & Container -->
  <g>
    <!-- Switch SW1 Container -->
    <rect x="380" y="140" width="370" height="120" class="sw-box" />
    <text x="400" y="165" class="text-label">SW1: Action / Cycle / Maintenance Switch</text>
    <text x="400" y="182" class="text-sub">Top Enclosure Mount • Raised Button</text>

    <!-- Switch Symbol SW1 -->
    <circle cx="490" cy="202" r="4" fill="#0f172a" />
    <circle cx="560" cy="202" r="4" fill="#0f172a" />
    <!-- Open Contact Lever -->
    <line x1="490" y1="202" x2="555" y2="185" stroke="#0f172a" stroke-width="3" stroke-linecap="round" />
    <!-- Push Button Actuator Bar -->
    <line x1="525" y1="180" x2="525" y2="160" stroke="#64748b" stroke-width="2" stroke-dasharray="3,3" />
    <rect x="510" y="152" width="30" height="8" fill="#2563eb" rx="2" />

    <!-- Terminal Labels -->
    <text x="475" y="222" class="text-pin" fill="#1d4ed8">Term A</text>
    <text x="545" y="222" class="text-label">Term B</text>

    <!-- Wire from SW1 to GND Rail -->
    <line x1="560" y1="202" x2="680" y2="202" class="gnd-wire" />
    <line x1="680" y1="202" x2="680" y2="342" class="gnd-wire" />
    <circle cx="680" cy="342" r="4" class="node" />
  </g>

  <!-- SW2 Schematic Symbol & Container -->
  <g>
    <!-- Switch SW2 Container -->
    <rect x="380" y="280" width="370" height="120" class="sw-box" />
    <text x="400" y="305" class="text-label">SW2: Hardware Chip Reset Switch</text>
    <text x="400" y="322" class="text-sub">Back Panel Mount • Recessed Pinhole Aperture</text>

    <!-- Switch Symbol SW2 -->
    <circle cx="490" cy="342" r="4" fill="#0f172a" />
    <circle cx="560" cy="342" r="4" fill="#0f172a" />
    <!-- Open Contact Lever -->
    <line x1="490" y1="342" x2="555" y2="325" stroke="#0f172a" stroke-width="3" stroke-linecap="round" />
    <!-- Push Button Actuator Bar -->
    <line x1="525" y1="320" x2="525" y2="300" stroke="#64748b" stroke-width="2" stroke-dasharray="3,3" />
    <rect x="510" y="292" width="30" height="8" fill="#d97706" rx="2" />

    <!-- Terminal Labels -->
    <text x="475" y="362" class="text-pin" fill="#b45309">Term A</text>
    <text x="545" y="362" class="text-label">Term B</text>

    <!-- Wire from SW2 to GND -->
    <line x1="560" y1="342" x2="680" y2="342" class="gnd-wire" />
    <line x1="680" y1="342" x2="680" y2="390" class="gnd-wire" />
  </g>

  <!-- Common Ground Connection -->
  <g>
    <line x1="680" y1="390" x2="680" y2="405" class="gnd-wire" />
    <line x1="660" y1="405" x2="700" y2="405" stroke="#0f172a" stroke-width="3" stroke-linecap="round" />
    <line x1="668" y1="412" x2="692" y2="412" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" />
    <line x1="674" y1="419" x2="686" y2="419" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />
    <line x1="678" y1="425" x2="682" y2="425" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" />
    <text x="680" y="445" text-anchor="middle" class="text-label">GND</text>
  </g>
</svg>
